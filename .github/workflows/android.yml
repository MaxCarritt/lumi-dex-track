name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    name: Verify and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate web app and data
        run: |
          node --check app.js
          node --test tests/save-sync.test.js
          node -e "JSON.parse(require('fs').readFileSync('data.json', 'utf8')); console.log('data.json is valid JSON')"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Run parser tests
        working-directory: android
        run: |
          javac -d /tmp/lumi-parser-tests ../android/app/src/main/java/com/lumidex/track/SaveParser.java ../tests/SaveParserTest.java
          java -cp /tmp/lumi-parser-tests SaveParserTest

      - name: Set Android version from Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag such as v1.2.3, got $GITHUB_REF_NAME"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          version_code=$((major * 10000 + minor * 100 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated Android versionCode is out of range: $version_code"
            exit 1
          fi
          {
            echo "VERSION_NAME=$version"
            echo "VERSION_CODE=$version_code"
          } >> "$GITHUB_ENV"
          echo "Building Android version $version (versionCode $version_code)"

      - name: Build and lint
        working-directory: android
        run: ./gradlew clean compileDebugJavaWithJavac lintDebug assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: lumi-dex-track-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged APK release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
