plugins { id 'com.android.application' }
android {
    namespace 'com.lumidex.track'
    compileSdk 35
    // Tagged CI builds provide VERSION_NAME and VERSION_CODE. Local/branch builds
    // retain a clearly identifiable development version.
    def buildVersionName = System.getenv('VERSION_NAME') ?: '0.0.0-dev'
    def buildVersionCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()
    defaultConfig {
        applicationId 'com.lumidex.track'
        minSdk 26
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/assets')
}
tasks.register('bundleWeb', Copy) {
    from('../..') { include 'index.html', 'app.js', 'save-sync.js', 'data.json', 'icon.svg', 'sprites/**' }
    into layout.buildDirectory.dir('generated/assets/www')
}
tasks.named('preBuild').configure { dependsOn 'bundleWeb' }
